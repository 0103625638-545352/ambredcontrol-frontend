# Mismo bloque que ya documenta DESPLIEGUE.md para el frontend en producción,
# sin dominio (solo localhost) porque esto corre en la propia máquina.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri /index.html;   # es una SPA sin router propio, pero esto no estorba
    }
}
